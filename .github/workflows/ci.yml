name: Terraform CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: Terraform environment
        required: true
        type: string
      action:
        description: Terraform operation
        required: true
        type: string
      academy_mode:
        description: Use AWS Academy temporary credentials
        required: true
        type: boolean
      confirm:
        description: Destroy confirmation (DESTROY HML or DESTROY PROD)
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy-plan, destroy]
      academy_mode:
        description: Set true only when the run uses AWS Academy temporary credentials (leave false for a normal IAM user)
        required: true
        default: false
        type: boolean
      confirm:
        description: Type DESTROY HML for an HML destroy
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.environment || 'hml' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Plan ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}
    needs: validate
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.action == 'plan' || inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}
    permissions:
      contents: read
    env:
      ACADEMY_MODE: ${{ inputs.academy_mode == true }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HML_PUBLIC_SUBNET_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_PUBLIC_SUBNET_IDS || '' }}
      HML_ALLOWED_CIDR_BLOCKS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALLOWED_CIDR_BLOCKS || '' }}
      PROD_ALLOWED_SECURITY_GROUP_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'prod' && vars.PROD_ALLOWED_SECURITY_GROUP_IDS || '' }}
      PROD_LAMBDA_SECURITY_GROUP_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'prod' && vars.PROD_LAMBDA_SECURITY_GROUP_IDS || '' }}
      ALARM_CPU_THRESHOLD: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_CPU_THRESHOLD || vars.PROD_ALARM_CPU_THRESHOLD }}
      ALARM_FREE_STORAGE_THRESHOLD_BYTES: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_FREE_STORAGE_THRESHOLD_BYTES || vars.PROD_ALARM_FREE_STORAGE_THRESHOLD_BYTES }}
      ALARM_CONNECTIONS_THRESHOLD: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_CONNECTIONS_THRESHOLD || vars.PROD_ALARM_CONNECTIONS_THRESHOLD }}
      ALARM_ACTIONS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && secrets.HML_ALARM_ACTIONS || secrets.PROD_ALARM_ACTIONS }}
      ALARM_OK_ACTIONS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && secrets.HML_ALARM_OK_ACTIONS || secrets.PROD_ALARM_OK_ACTIONS }}
      FINAL_SNAPSHOT_REVISION: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_FINAL_SNAPSHOT_REVISION || vars.PROD_FINAL_SNAPSHOT_REVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Validate credentials before state access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || {
            echo 'AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are required.' >&2
            exit 1
          }
          # Academy hands out temporary credentials, which always carry a session
          # token. A long-lived IAM user has none, so demand the token only when
          # the run declares Academy mode instead of rejecting every other caller.
          if [[ "$ACADEMY_MODE" == true && -z "$AWS_SESSION_TOKEN" ]]; then
            echo 'academy_mode=true requires access key, secret, and session token.' >&2
            exit 1
          fi
      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS and cross-repository state preflight
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          bash .github/scripts/bootstrap-backend.sh repo-db-infra "$TF_ENVIRONMENT"
          bash .github/scripts/validate-inputs.sh "$TF_ENVIRONMENT"
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Save Terraform plan
        run: terraform plan -input=false -out=terraform.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}-${{ github.run_id }}
          path: terraform.tfplan
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl terraform.tfplan

  apply:
    name: Apply ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}
    needs: plan
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}
    permissions:
      contents: read
    env:
      TF_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}
      ACADEMY_MODE: ${{ inputs.academy_mode == true }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Production confirmation for manual apply
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
        run: |
          [[ "${{ inputs.confirm }}" == 'APPLY PROD' ]] || { echo 'Manual production apply requires confirm="APPLY PROD".' >&2; exit 1; }
      - name: Validate credentials before state access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || {
            echo 'AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are required.' >&2
            exit 1
          }
          # See the plan job: the session token is Academy-only, not universal.
          if [[ "$ACADEMY_MODE" == true && -z "$AWS_SESSION_TOKEN" ]]; then
            echo 'academy_mode=true requires complete Academy credentials.' >&2
            exit 1
          fi
      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: State preflight
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          bash .github/scripts/bootstrap-backend.sh repo-db-infra "$TF_ENVIRONMENT"
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}-${{ github.run_id }}
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Apply saved Terraform plan
        run: terraform apply -input=false terraform.tfplan
      - if: always()
        run: rm -f backend.hcl terraform.tfplan

  destroy:
    name: Guarded ${{ inputs.environment == 'prod' && 'production' || 'HML' }} destroy
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_call' && inputs.environment == 'hml')) &&
      (inputs.action == 'destroy-plan' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || 'hml' }}
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Enforce HML destroy guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.environment }}" == hml || "${{ inputs.environment }}" == prod ]] || { echo 'Destroy environment must be hml or prod.' >&2; exit 1; }
          if [[ "${{ inputs.environment }}" == prod && "${{ github.event_name }}" != workflow_dispatch ]]; then
            echo 'Production destroy is available only through workflow_dispatch.' >&2
            exit 1
          fi
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo 'Destroy requires AWS credentials.' >&2; exit 1; }
          if [[ "${{ inputs.action }}" == destroy ]]; then
            expected_confirmation='DESTROY HML'
            [[ "${{ inputs.environment }}" == prod ]] && expected_confirmation='DESTROY PROD'
            [[ "${{ inputs.confirm }}" == "$expected_confirmation" ]] || { echo "Destroy requires confirm=\"$expected_confirmation\"." >&2; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Locate existing state without bootstrapping
        id: destroy-backend
        shell: bash
        run: bash .github/scripts/read-backend.sh repo-db-infra "${{ inputs.environment }}"
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
        if: steps.destroy-backend.outputs.state_exists == 'true'
      - name: Disable RDS deletion protection before confirmed destroy
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'destroy' &&
          ((inputs.environment == 'prod' && inputs.confirm == 'DESTROY PROD') ||
          (inputs.environment == 'hml' && inputs.confirm == 'DESTROY HML')) &&
          steps.destroy-backend.outputs.state_exists == 'true'
        env:
          DB_IDENTIFIER: ${{ steps.destroy-backend.outputs.db_identifier }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DB_IDENTIFIER" == "tc3-db-${{ inputs.environment }}" ]] || {
            echo 'Refusing to modify an unexpected DB identifier.' >&2
            exit 1
          }
          aws rds modify-db-instance \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --no-deletion-protection
          aws rds wait db-instance-available \
            --db-instance-identifier "$DB_IDENTIFIER"
      - run: terraform plan -destroy -input=false
        if: inputs.action == 'destroy-plan' && steps.destroy-backend.outputs.state_exists == 'true'
      - run: terraform plan -destroy -input=false -out=destroy.tfplan
        if: inputs.action == 'destroy' && steps.destroy-backend.outputs.state_exists == 'true'
      - run: terraform apply -input=false destroy.tfplan
        if: inputs.action == 'destroy' && steps.destroy-backend.outputs.state_exists == 'true'
      - if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl destroy.tfplan
