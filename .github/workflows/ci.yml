name: Terraform CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.environment || 'hml' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_ENVIRONMENT: ${{ inputs.environment || 'hml' }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    # Never expose credentials to a pull request from a fork.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'hml' }}-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_hml_public_subnet_ids: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_PUBLIC_SUBNET_IDS || '' }}
      TF_VAR_hml_allowed_cidr_blocks: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_ALLOWED_CIDR_BLOCKS || '' }}
      TF_VAR_prod_private_subnet_ids: ${{ (inputs.environment || 'hml') == 'prod' && vars.PROD_PRIVATE_SUBNET_IDS || '' }}
      TF_VAR_prod_allowed_security_group_ids: ${{ (inputs.environment || 'hml') == 'prod' && vars.PROD_ALLOWED_SECURITY_GROUP_IDS || '' }}
      TF_VAR_prod_lambda_security_group_ids: ${{ (inputs.environment || 'hml') == 'prod' && vars.PROD_LAMBDA_SECURITY_GROUP_IDS || '' }}
      TF_VAR_alarm_cpu_threshold: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_ALARM_CPU_THRESHOLD || vars.PROD_ALARM_CPU_THRESHOLD }}
      TF_VAR_alarm_free_storage_threshold_bytes: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_ALARM_FREE_STORAGE_THRESHOLD_BYTES || vars.PROD_ALARM_FREE_STORAGE_THRESHOLD_BYTES }}
      TF_VAR_alarm_connections_threshold: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_ALARM_CONNECTIONS_THRESHOLD || vars.PROD_ALARM_CONNECTIONS_THRESHOLD }}
      TF_VAR_alarm_actions: ${{ (inputs.environment || 'hml') == 'hml' && secrets.HML_ALARM_ACTIONS || secrets.PROD_ALARM_ACTIONS }}
      TF_VAR_alarm_ok_actions: ${{ (inputs.environment || 'hml') == 'hml' && secrets.HML_ALARM_OK_ACTIONS || secrets.PROD_ALARM_OK_ACTIONS }}
      TF_VAR_final_snapshot_revision: ${{ (inputs.environment || 'hml') == 'hml' && vars.HML_FINAL_SNAPSHOT_REVISION || vars.PROD_FINAL_SNAPSHOT_REVISION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Reject partial temporary credentials
        if: >-
          (env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.AWS_SESSION_TOKEN != '') &&
          !(env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != '')
        run: exit 1
      - name: Fail closed on environment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(TF_VAR_alarm_cpu_threshold TF_VAR_alarm_free_storage_threshold_bytes TF_VAR_alarm_connections_threshold TF_VAR_alarm_actions TF_VAR_alarm_ok_actions TF_VAR_final_snapshot_revision)
          if [[ "$TF_ENVIRONMENT" == hml ]]; then
            required+=(TF_VAR_hml_public_subnet_ids TF_VAR_hml_allowed_cidr_blocks)
            [[ -z "${TF_VAR_prod_private_subnet_ids}" && -z "${TF_VAR_prod_allowed_security_group_ids}" && -z "${TF_VAR_prod_lambda_security_group_ids}" ]] || { echo 'PROD inputs must not be supplied to HML'; exit 1; }
          else
            required+=(TF_VAR_prod_private_subnet_ids TF_VAR_prod_allowed_security_group_ids TF_VAR_prod_lambda_security_group_ids)
            [[ -z "${TF_VAR_hml_public_subnet_ids}" && -z "${TF_VAR_hml_allowed_cidr_blocks}" ]] || { echo 'HML inputs must not be supplied to PROD'; exit 1; }
          fi
          for name in "${required[@]}"; do [[ -n "${!name}" ]] || { echo "Missing required environment value: $name"; exit 1; }; done
      - name: Configure AWS credentials (temporary)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -reconfigure -backend-config=organization=async_furious -backend-config=workspaces.name=tc3-db-${{ inputs.environment || 'hml' }} -input=false
      - run: terraform plan -input=false -var=environment=${{ env.TF_ENVIRONMENT }} -out=tfplan
      - name: Upload sensitive plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.run_id }}
          path: tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Configure required reviewers on both environments; prod must be protected.
    environment: ${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_hml_public_subnet_ids: ${{ inputs.environment == 'hml' && vars.HML_PUBLIC_SUBNET_IDS || '' }}
      TF_VAR_hml_allowed_cidr_blocks: ${{ inputs.environment == 'hml' && vars.HML_ALLOWED_CIDR_BLOCKS || '' }}
      TF_VAR_prod_private_subnet_ids: ${{ inputs.environment == 'prod' && vars.PROD_PRIVATE_SUBNET_IDS || '' }}
      TF_VAR_prod_allowed_security_group_ids: ${{ inputs.environment == 'prod' && vars.PROD_ALLOWED_SECURITY_GROUP_IDS || '' }}
      TF_VAR_prod_lambda_security_group_ids: ${{ inputs.environment == 'prod' && vars.PROD_LAMBDA_SECURITY_GROUP_IDS || '' }}
      TF_VAR_alarm_cpu_threshold: ${{ inputs.environment == 'hml' && vars.HML_ALARM_CPU_THRESHOLD || vars.PROD_ALARM_CPU_THRESHOLD }}
      TF_VAR_alarm_free_storage_threshold_bytes: ${{ inputs.environment == 'hml' && vars.HML_ALARM_FREE_STORAGE_THRESHOLD_BYTES || vars.PROD_ALARM_FREE_STORAGE_THRESHOLD_BYTES }}
      TF_VAR_alarm_connections_threshold: ${{ inputs.environment == 'hml' && vars.HML_ALARM_CONNECTIONS_THRESHOLD || vars.PROD_ALARM_CONNECTIONS_THRESHOLD }}
      TF_VAR_alarm_actions: ${{ inputs.environment == 'hml' && secrets.HML_ALARM_ACTIONS || secrets.PROD_ALARM_ACTIONS }}
      TF_VAR_alarm_ok_actions: ${{ inputs.environment == 'hml' && secrets.HML_ALARM_OK_ACTIONS || secrets.PROD_ALARM_OK_ACTIONS }}
      TF_VAR_final_snapshot_revision: ${{ inputs.environment == 'hml' && vars.HML_FINAL_SNAPSHOT_REVISION || vars.PROD_FINAL_SNAPSHOT_REVISION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Reject partial temporary credentials
        if: >-
          (env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.AWS_SESSION_TOKEN != '') &&
          !(env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != '')
        run: exit 1
      - name: Fail closed on environment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(TF_VAR_alarm_cpu_threshold TF_VAR_alarm_free_storage_threshold_bytes TF_VAR_alarm_connections_threshold TF_VAR_alarm_actions TF_VAR_alarm_ok_actions TF_VAR_final_snapshot_revision)
          if [[ "${TF_ENVIRONMENT}" == hml ]]; then
            required+=(TF_VAR_hml_public_subnet_ids TF_VAR_hml_allowed_cidr_blocks)
            [[ -z "${TF_VAR_prod_private_subnet_ids}" && -z "${TF_VAR_prod_allowed_security_group_ids}" && -z "${TF_VAR_prod_lambda_security_group_ids}" ]] || { echo 'PROD inputs must not be supplied to HML'; exit 1; }
          else
            required+=(TF_VAR_prod_private_subnet_ids TF_VAR_prod_allowed_security_group_ids TF_VAR_prod_lambda_security_group_ids)
            [[ -z "${TF_VAR_hml_public_subnet_ids}" && -z "${TF_VAR_hml_allowed_cidr_blocks}" ]] || { echo 'HML inputs must not be supplied to PROD'; exit 1; }
          fi
          for name in "${required[@]}"; do [[ -n "${!name}" ]] || { echo "Missing required environment value: $name"; exit 1; }; done
      - name: Configure AWS credentials (temporary)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -reconfigure -backend-config=organization=async_furious -backend-config=workspaces.name=tc3-db-${{ inputs.environment || 'hml' }} -input=false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.run_id }}
      - run: terraform apply -input=false -auto-approve tfplan
