name: Terraform CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy-plan, destroy]
      academy_mode:
        description: Confirm this run uses AWS Academy temporary credentials
        required: true
        default: false
        type: boolean
      confirm:
        description: Type DESTROY HML for an HML destroy
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.environment || 'hml' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Plan ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}
    needs: validate
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}
    permissions:
      contents: read
      id-token: write
    env:
      ACADEMY_MODE: ${{ (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'hml' && inputs.academy_mode == true) }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HML_PUBLIC_SUBNET_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_PUBLIC_SUBNET_IDS || '' }}
      HML_ALLOWED_CIDR_BLOCKS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALLOWED_CIDR_BLOCKS || '' }}
      PROD_PRIVATE_SUBNET_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'prod' && vars.PROD_PRIVATE_SUBNET_IDS || '' }}
      PROD_ALLOWED_SECURITY_GROUP_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'prod' && vars.PROD_ALLOWED_SECURITY_GROUP_IDS || '' }}
      PROD_LAMBDA_SECURITY_GROUP_IDS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'prod' && vars.PROD_LAMBDA_SECURITY_GROUP_IDS || '' }}
      ALARM_CPU_THRESHOLD: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_CPU_THRESHOLD || vars.PROD_ALARM_CPU_THRESHOLD }}
      ALARM_FREE_STORAGE_THRESHOLD_BYTES: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_FREE_STORAGE_THRESHOLD_BYTES || vars.PROD_ALARM_FREE_STORAGE_THRESHOLD_BYTES }}
      ALARM_CONNECTIONS_THRESHOLD: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_ALARM_CONNECTIONS_THRESHOLD || vars.PROD_ALARM_CONNECTIONS_THRESHOLD }}
      ALARM_ACTIONS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && secrets.HML_ALARM_ACTIONS || secrets.PROD_ALARM_ACTIONS }}
      ALARM_OK_ACTIONS: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && secrets.HML_ALARM_OK_ACTIONS || secrets.PROD_ALARM_OK_ACTIONS }}
      FINAL_SNAPSHOT_REVISION: ${{ (inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml')) == 'hml' && vars.HML_FINAL_SNAPSHOT_REVISION || vars.PROD_FINAL_SNAPSHOT_REVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Validate credentials before state access
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TF_ENVIRONMENT" == prod && "$ACADEMY_MODE" == true ]]; then
            echo 'academy_mode=true is not permitted for prod.' >&2
            exit 1
          fi
          if [[ "$ACADEMY_MODE" == true && "$TF_ENVIRONMENT" != hml ]]; then
            echo 'Academy mode is restricted to HML.' >&2
            exit 1
          fi
          present=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            [[ -n "${!name}" ]] && present=$((present + 1))
          done
          if [[ "$ACADEMY_MODE" == true ]]; then
            if (( present != 3 )); then
              echo 'academy_mode=true requires access key, secret, and session token.' >&2
              exit 1
            fi
          else
            if (( present != 0 )); then
              echo 'academy_mode=false requires OIDC credentials, not Academy credentials.' >&2
              exit 1
            fi
          fi
          if (( present == 0 && -z "${{ vars.AWS_ROLE_ARN }}" )); then
            echo 'OIDC mode requires an OIDC role ARN.' >&2
            exit 1
          fi
      - name: Configure AWS credentials (Academy)
        if: env.ACADEMY_MODE == 'true' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.ACADEMY_MODE == 'false' && env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS and cross-repository state preflight
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          bash .github/scripts/bootstrap-backend.sh repo-db-infra "$TF_ENVIRONMENT"
          bash .github/scripts/validate-inputs.sh "$TF_ENVIRONMENT"
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Save Terraform plan
        run: terraform plan -input=false -out=terraform.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform.tfplan
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl terraform.tfplan

  apply:
    name: Apply ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'hml') }}
    needs: plan
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment || (github.ref_name == 'main' && 'production' || 'hml') }}
    permissions:
      contents: read
      id-token: write
    env:
      ACADEMY_MODE: ${{ (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'hml' && inputs.academy_mode == true) }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Production confirmation for manual apply
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
        run: |
          [[ "${{ inputs.confirm }}" == 'APPLY PROD' ]] || { echo 'Manual production apply requires confirm="APPLY PROD".' >&2; exit 1; }
      - name: Validate credentials before state access
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TF_ENVIRONMENT" == prod && "$ACADEMY_MODE" == true ]]; then
            echo 'academy_mode=true is not permitted for prod.' >&2
            exit 1
          fi
          if [[ "$ACADEMY_MODE" == true && "$TF_ENVIRONMENT" != hml ]]; then
            echo 'Academy mode is restricted to HML.' >&2
            exit 1
          fi
          count=0
          for value in "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"; do [[ -n "$value" ]] && count=$((count + 1)); done
          if [[ "$ACADEMY_MODE" == true ]]; then
            [[ "$count" == 3 ]] || { echo 'academy_mode=true requires complete Academy credentials.' >&2; exit 1; }
          else
            [[ "$count" == 0 ]] || { echo 'academy_mode=false requires OIDC credentials, not Academy credentials.' >&2; exit 1; }
            [[ -n "${{ vars.AWS_ROLE_ARN }}" ]] || { echo 'OIDC mode requires an OIDC role ARN.' >&2; exit 1; }
          fi
      - name: Configure AWS credentials (Academy)
        if: env.ACADEMY_MODE == 'true' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.ACADEMY_MODE == 'false' && env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: State preflight
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          bash .github/scripts/bootstrap-backend.sh repo-db-infra "$TF_ENVIRONMENT"
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Apply saved Terraform plan
        run: terraform apply -input=false terraform.tfplan
      - if: always()
        run: rm -f backend.hcl terraform.tfplan

  destroy:
    name: Guarded HML destroy
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'destroy-plan' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment:
      name: hml
    permissions:
      contents: read
      id-token: write
    env:
      ACADEMY_MODE: ${{ inputs.academy_mode == true }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Enforce HML Academy destroy guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.environment }}" == hml ]] || { echo 'Destroy is HML-only.' >&2; exit 1; }
          [[ "$ACADEMY_MODE" == true ]] || { echo 'Destroy requires academy_mode=true.' >&2; exit 1; }
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" && -n "$AWS_SESSION_TOKEN" ]] || { echo 'Destroy requires all temporary Academy credentials.' >&2; exit 1; }
          if [[ "${{ inputs.action }}" == destroy ]]; then [[ "${{ inputs.confirm }}" == 'DESTROY HML' ]] || { echo 'Destroy requires confirm="DESTROY HML".' >&2; exit 1; }; fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Locate existing state without bootstrapping
        id: destroy-backend
        shell: bash
        run: bash .github/scripts/read-backend.sh repo-db-infra hml
      - run: terraform init -reconfigure -input=false -backend-config=backend.hcl
        if: steps.destroy-backend.outputs.state_exists == 'true'
      - run: terraform plan -destroy -input=false
        if: inputs.action == 'destroy-plan' && steps.destroy-backend.outputs.state_exists == 'true'
      - run: terraform plan -destroy -input=false -out=destroy.tfplan
        if: inputs.action == 'destroy' && steps.destroy-backend.outputs.state_exists == 'true'
      - run: terraform apply -input=false destroy.tfplan
        if: inputs.action == 'destroy' && steps.destroy-backend.outputs.state_exists == 'true'
      - if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl destroy.tfplan
