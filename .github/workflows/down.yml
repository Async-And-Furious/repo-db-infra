name: Terraform Destroy (Confirmed)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY HML or DESTROY PROD to confirm deletion
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]

permissions:
  contents: read

jobs:
  destroy:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      environment: ${{ inputs.environment }}
      action: destroy
      academy_mode: false
      confirm: ${{ inputs.confirm }}
    secrets: inherit
