name: Terraform Destroy (Confirmed)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY HML to confirm HML deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      environment: hml
      action: destroy
      academy_mode: false
      confirm: ${{ inputs.confirm }}
    secrets: inherit
